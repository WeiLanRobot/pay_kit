name: pay_kit
description: Flutter 支付插件，支持微信支付、支付宝支付、苹果内购
version: 1.3.1
homepage: https://github.com/WeiLanRobot/pay_kit
repository: https://github.com/WeiLanRobot/pay_kit
issue_tracker: https://github.com/WeiLanRobot/pay_kit/issues
documentation: https://github.com/WeiLanRobot/pay_kit#readme

environment:
  sdk: ">=3.3.4 <4.0.0"
  flutter: ">=3.19.6"

dependencies:
  flutter:
    sdk: flutter

  # iOS 内购
  crypto: ^3.0.3
  path_provider: ^2.1.2
  sqflite: ^2.3.3
  uuid: ^4.3.3

  # 支付宝支付
  alipay_payment: ^1.1.2

  # 微信支付
  wechat_bridge: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: '>=2.3.2 <2.4.0'
  sqlite3: ^2.4.3

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: PayKitTransactionPlugin
  assets:
    - assets/icons/

dependency_overrides:
  http: ^1.2.2
